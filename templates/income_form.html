{% extends "base.html" %}
{% block title %}הוספת הכנסה{% endblock %}
{% block content %}
<h1>הוספת הכנסה</h1>
<form method="post" class="form">
  <label>תאריך
    <input type="date" name="date" value="{{ today.isoformat() }}" required>
  </label>

  <label>מקור
    <select name="source" required>
      {% for value, label in sources %}
      <option value="{{ value }}">{{ label }}</option>
      {% endfor %}
    </select>
  </label>

  <label>תיאור
    <input type="text" name="description" placeholder="לדוגמה: משכורת 7/2026 / משמרות בוסטון">
  </label>

  <label>ברוטו (₪)
    <input type="number" step="0.01" name="gross" required>
  </label>

  <label>נטו (₪) — רלוונטי לשכיר
    <input type="number" step="0.01" name="net">
  </label>

  <label>שעות — רלוונטי לבוסטון
    <input type="number" step="0.01" name="hours">
  </label>

  <label>בונוס (₪)
    <input type="number" step="0.01" name="bonus">
  </label>

  <label>ניכוי מס במקור (₪)
    <input type="number" step="0.01" name="tax_withheld">
  </label>

  <button class="btn" type="submit">שמירה</button>
</form>
{% endblock %}
